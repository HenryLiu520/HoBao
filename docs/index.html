<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>荷包 HoBao · 网页试玩版</title>
<style>
  :root{
    --bg:#F6F4FA; --surface-low:#EFECF7; --primary-container:#DDDAF6;
    --primary:#46528C; --on-primary:#FFFFFF;
    --on-surface:#1B1B21; --on-surface-variant:#63606A; --outline:#7A757F;
    --error:#B3261E; --error-container:#F9DEDC; --chip-bg:#DEE1F9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:#E7E3EE; color:var(--on-surface);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:20px 12px 32px;
  }

  /* ── 页面外壳 ── */
  .wrap{width:100%;max-width:400px}
  .brand{display:flex;align-items:baseline;gap:8px;margin:0 4px 10px;color:#4a4655}
  .brand b{font-size:17px;letter-spacing:.5px}
  .brand span{font-size:12px;color:#7d7885}
  .phone{
    background:var(--bg);border-radius:28px;box-shadow:0 12px 36px rgba(60,55,80,.16);
    overflow:hidden;display:flex;flex-direction:column;position:relative;
    /* 固定高度：两个页签内容长短不同，但外框必须一模一样大。
       内容在里面滚，不外溢。 */
    height:min(720px, calc(100dvh - 130px));min-height:520px;
  }

  /* ── 标题栏 ── */
  .appbar{padding:18px 20px 6px;font-size:22px;font-weight:500;letter-spacing:.3px}

  /* ── 页面 ── */
  .screen{flex:1;min-height:0;padding:0 16px 88px;overflow-y:auto;scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  .screen[hidden]{display:none}

  /* 合计卡：记一笔的「本月支出」和回顾的「合计支出」共用这一套尺寸 */
  .totalcard{
    background:var(--primary-container);border-radius:26px;padding:22px;
    margin-top:12px;display:flex;justify-content:space-between;align-items:flex-end;
  }
  .totalcard .label{font-size:12px;color:#33323d;letter-spacing:.4px}
  .totalcard .big{font-size:36px;font-weight:700;letter-spacing:-.5px;margin:2px 0 0;line-height:1.15}
  .totalcard .sub{font-size:12px;color:#3b3a46}
  .totalcard .count{font-size:14px;color:#3b3a46;flex:0 0 auto;padding-bottom:4px}

  /* 输入框：标签骑在边框上 */
  .field{position:relative;padding-top:8px}
  .field > .lab{
    position:absolute;top:0;left:12px;background:var(--bg);padding:0 4px;
    font-size:11.5px;color:var(--on-surface-variant);line-height:16px;pointer-events:none;
  }
  .field input,.field .ro{
    width:100%;height:56px;border:1px solid var(--outline);border-radius:10px;background:transparent;
    padding:0 16px;font-size:16px;color:var(--on-surface);font-family:inherit;outline:none;
  }
  .field input::placeholder{color:#9a95a3}
  .field input:focus{border:2px solid var(--primary);padding:0 15px}
  .field .ro{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
  .field .ro .chev{color:var(--on-surface-variant);display:flex;align-items:center;flex:0 0 auto}
  .field .ro .chev svg{width:18px;height:18px;fill:currentColor}
  .field.err input{border:2px solid var(--error);padding:0 15px}
  .field .msg{height:16px;font-size:11px;color:var(--error);padding:2px 12px 0;line-height:14px}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .gap10{height:10px}
  .gap14{height:14px}

  /* 分类 chips */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--outline);border-radius:999px;background:transparent;
    padding:9px 18px;font-size:14px;color:var(--on-surface);cursor:pointer;font-family:inherit;
  }
  .chip[aria-pressed="true"]{background:var(--chip-bg);border-color:transparent}

  /* 三段切换：支出 / 退款 / 收入。三种款项用三种底色，扫一眼就知道在记什么 */
  .seg{display:flex;gap:8px;margin-top:14px}
  .seg .chip{flex:1;padding:10px 0;text-align:center}
  #segRefund[aria-pressed="true"]{background:#EADCF0;border-color:transparent}
  #segIncome[aria-pressed="true"]{background:#DAEDE2;border-color:transparent}

  /* 回顾页两个账本 */
  .ledger{display:flex;gap:8px;margin-top:12px}

  /* 金额的颜色：退款紫、收入绿。退款是**负数**，颜色和符号双重提示 */
  .item .amt .main.refund{color:#6B3FA0}
  .item .amt .main.income{color:#1B6C4A}

  .btn{
    width:100%;height:56px;border:0;border-radius:28px;background:var(--primary);color:var(--on-primary);
    font-size:16px;font-family:inherit;cursor:pointer;margin-top:14px;
  }
  .btn:disabled{background:#DAD6E2;color:#8E8A96;cursor:default}

  /* 列表 */
  .sec-title{font-size:15px;font-weight:600;margin:22px 0 8px}
  .item{
    background:var(--surface-low);border-radius:14px;padding:12px 14px;margin-bottom:8px;
    display:flex;align-items:center;gap:12px;
  }
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .item .mid{flex:1;min-width:0}
  .item .reason{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .meta{font-size:12px;color:var(--on-surface-variant);margin-top:2px}
  .item .amt{text-align:right;flex:0 0 auto}
  .item .amt .main{font-size:15px;font-weight:700}
  .item .amt .orig{font-size:11.5px;color:var(--on-surface-variant);margin-top:2px}
  .empty{text-align:center;color:var(--on-surface-variant);font-size:13px;padding:40px 0}

  /* 回顾页顶部 */
  .searchrow{display:flex;gap:10px;margin-top:12px}
  .searchrow input{
    flex:1;height:52px;border:1px solid var(--outline);border-radius:26px;background:transparent;
    padding:0 18px 0 42px;font-size:15px;font-family:inherit;outline:none;color:var(--on-surface);
  }
  .searchrow .box{position:relative;flex:1;display:flex}
  .searchrow .box .mag{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#6b6674;font-size:15px}
  .funnel{
    width:52px;height:52px;border:0;border-radius:50%;background:var(--primary-container);
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .funnel.on{background:var(--primary)}
  .funnel.on svg{fill:#fff}
  .funnel svg{width:18px;height:18px;fill:#33323d}

  .filtersum{font-size:12px;color:var(--on-surface-variant);margin:10px 2px 0;display:flex;justify-content:space-between;align-items:center}
  .filtersum button{background:none;border:0;color:var(--primary);font-size:12px;font-family:inherit;cursor:pointer}



  /* ── 分析页 ── */
  .an-card{background:var(--surface-low);border-radius:22px;padding:14px 0 8px;margin-top:12px}
  .an-title{font-size:15px;font-weight:600;margin:0 16px 6px}
  .an-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 16px 2px}
  .an-count{font-size:12px;color:var(--on-surface-variant)}
  .donut-wrap{position:relative;width:200px;height:200px;margin:6px auto 2px}
  .donut-wrap svg{width:100%;height:100%;display:block}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;pointer-events:none}
  .dc-label{font-size:11px;color:var(--on-surface-variant)}
  .dc-value{font-size:17px;font-weight:700;margin-top:2px}
  .an-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid rgba(0,0,0,.06)}
  .an-row .nm{flex:1;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .an-row .amt{font-size:14px;font-weight:600;text-align:right}
  .an-row .pct{font-size:11.5px;color:var(--on-surface-variant);text-align:right;margin-top:2px}
  .chart-box{position:relative}
  /* 纵轴冻结在左边：横向滚动时刻度不跟着跑（真机的轴是固定的） */
  .yaxis{position:absolute;left:0;top:0;pointer-events:none;background:var(--surface-low)}
  .chart-scroll{overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
  .chart-scroll::-webkit-scrollbar{display:none}
  .chart-scroll svg{display:block}
  .an-foot{font-size:11.5px;color:var(--on-surface-variant);line-height:1.7;margin:14px 4px 0}

  /* 底部页签 */
  .tabs{
    position:absolute;left:0;right:0;bottom:0;height:74px;background:var(--bg);
    display:flex;border-top:1px solid #E4E0EC;
  }
  .tab{
    flex:1;background:none;border:0;font-family:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:11.5px;color:#4a4655;
  }
  .tab .pill{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .tab[aria-selected="true"] .pill{background:var(--primary-container)}
  .tab[aria-selected="true"]{font-weight:600}

  /* 弹层 */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:400px;
    background:var(--bg);border-radius:26px 26px 0 0;padding:10px 0 22px;z-index:21;
    transition:transform .24s cubic-bezier(.2,.8,.2,1);max-height:78vh;overflow-y:auto;
  }
  .sheet.on{transform:translate(-50%,0)}
  .sheet .grab{width:32px;height:4px;border-radius:2px;background:#C9C4D2;margin:2px auto 12px}
  .sheet h3{margin:0 24px 4px;font-size:20px;font-weight:600}
  .sheet .hint{margin:0 24px 8px;font-size:12px;color:var(--on-surface-variant)}
  .pick{display:flex;align-items:center;gap:14px;padding:10px 24px;cursor:pointer}
  .pick[aria-disabled="true"]{opacity:.45;cursor:default}
  .pick .flag{font-size:20px}
  .pick .mid{flex:1}
  .pick .t{font-size:15px;font-weight:500}
  .pick .s{font-size:11.5px;color:var(--on-surface-variant);margin-top:2px}
  .pick .s.bad{color:var(--error)}
  .pick .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--outline);flex:0 0 auto}
  .pick[aria-checked="true"] .radio{border:6px solid var(--primary)}

  /* 提示条 */
  .toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;
    background:#2C2B33;color:#fff;font-size:13px;padding:12px 18px;border-radius:10px;
    transition:all .22s;z-index:30;pointer-events:none;max-width:340px;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  .foot{max-width:400px;margin:14px 4px 0;font-size:11.5px;color:#7d7885;line-height:1.7}
  .foot a{color:#5a5680}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand"><b>荷包 HoBao</b><span>网页试玩版</span></div>

  <div class="phone">
    <div class="appbar" id="title">记一笔</div>

    <!-- ═══ 记一笔 ═══ -->
    <div class="screen" id="screen-add">
      <div class="totalcard">
        <div>
          <div class="label">本月支出</div>
          <div class="big" id="monthTotal">CNY 0.00</div>
          <div class="sub" id="monthSub">共 0 笔 · 按记账时汇率折算</div>
          <div class="sub" id="monthRefund" hidden style="margin-top:2px"></div>
          <div class="sub" id="monthIncome" hidden style="margin-top:2px"></div>
        </div>
      </div>

      <div class="seg" id="seg">
        <button class="chip" id="segSpend"  aria-pressed="true">− 支出</button>
        <button class="chip" id="segRefund" aria-pressed="false">↩ 退款</button>
        <button class="chip" id="segIncome" aria-pressed="false">+ 收入</button>
      </div>

      <div class="gap14"></div>

      <div class="row2">
        <div class="field" id="f-amount">
          <div class="lab">金额</div>
          <input id="amount" inputmode="decimal" autocomplete="off">
          <div class="msg" id="amountMsg"></div>
        </div>
        <div class="field">
          <div class="lab">原因</div>
          <input id="reason" autocomplete="off">
          <div class="msg"></div>
        </div>
      </div>

      <div class="gap10"></div>

      <div class="row2">
        <div class="field">
          <div class="lab">货币</div>
          <div class="ro" id="currencyBtn"><span id="currencyVal">CNY</span>
            <span class="chev"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></span>
          </div>
          <div class="msg"></div>
        </div>
        <div class="field">
          <div class="lab">日期</div>
          <label class="ro" for="date"><span id="dateVal">今天</span>
            <span class="chev"><svg viewBox="0 0 24 24"><path d="M6 2h2v2h8V2h2v2h2a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h2V2zm13 7H5v10h14V9z"/></svg></span>
          </label>
          <input type="date" id="date" style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none">
          <div class="msg"></div>
        </div>
      </div>

      <div class="gap14"></div>
      <div class="chips" id="catChips"></div>

      <button class="btn" id="saveBtn" disabled>记一笔</button>

      <div class="sec-title" id="recentTitle" hidden>最近记的</div>
      <div id="recentList"></div>
    </div>

    <!-- ═══ 回顾 ═══ -->
    <div class="screen" id="screen-history" hidden>
      <div class="searchrow">
        <div class="box">
          <span class="mag">⌕</span>
          <input id="q" placeholder="搜索原因…" autocomplete="off">
        </div>
        <button class="funnel" id="funnel" aria-label="筛选">
          <svg viewBox="0 0 24 24"><path d="M4 5h16l-6.5 8.5v5.5l-3-2v-3.5z"/></svg>
        </button>
      </div>

      <div class="filtersum" id="filterSum" hidden>
        <span id="filterSumText"></span>
        <button id="clearFilter">清除</button>
      </div>

      <div class="ledger">
        <button class="chip" id="ledSpend"  aria-pressed="true">花销</button>
        <button class="chip" id="ledIncome" aria-pressed="false">收入</button>
      </div>

      <div class="totalcard">
        <div>
          <div class="label" id="histTotalLabel">支出合计</div>
          <div class="big" id="histTotal">CNY 0.00</div>
          <!-- 三个数：支出 ≥0、退款 ≤0、净额可正可负。
               绝不让「支出」变成负数 —— 那是「花了 -20 元」，没有意义。 -->
          <div class="sub" id="histRefund" hidden style="margin-top:2px"></div>
        </div>
        <div class="count" id="histCount">0 笔</div>
      </div>

      <div class="sec-title" id="histTitle" hidden>全部记录</div>
      <div id="histList"></div>
    </div>


    <!-- ═══ 分析 ═══ -->
    <div class="screen" id="screen-analysis" hidden>
      <div class="chips" id="rangeChips" style="margin-top:12px"></div>

      <div class="totalcard">
        <div>
          <div class="label" id="anRangeLabel">本月 · 共 0 天</div>
          <div class="big" id="anTotal">CNY 0.00</div>
          <div class="sub" id="anSub">0 笔 · 日均 CNY 0.00</div>
          <div class="sub" id="anRefund" hidden style="margin-top:2px"></div>
          <div class="sub" id="anIncome" hidden style="margin-top:2px"></div>
        </div>
      </div>

      <div class="an-card">
        <div class="an-title">分类占比</div>
        <div class="donut-wrap">
          <svg id="donut" viewBox="0 0 200 200"></svg>
          <div class="donut-center">
            <div class="dc-label">总支出</div>
            <div class="dc-value" id="donutTotal">CNY 0.00</div>
          </div>
        </div>
        <div id="catList"></div>
      </div>

      <div class="an-card">
        <div class="an-head">
          <span class="an-title" style="margin:0">趋势</span>
          <span class="an-count" id="trendCount">0 天</span>
        </div>
        <div class="chips" id="granChips" style="padding:6px 16px 2px"></div>
        <div class="chart-box">
          <div class="chart-scroll" id="chartScroll"><svg id="trendChart" height="190"></svg></div>
          <svg class="yaxis" id="yaxis" height="190"></svg>
        </div>
      </div>

      <div class="an-foot">折人民币按每条账<b>记账当时</b>的汇率快照计算，不是今天的汇率。</div>
    </div>
    <!-- 页签 -->
    <div class="tabs">
      <button class="tab" id="tabAdd" aria-selected="true"><span class="pill">＋</span>记一笔</button>
      <button class="tab" id="tabHist" aria-selected="false"><span class="pill">☰</span>回顾</button>
      <button class="tab" id="tabAna" aria-selected="false"><span class="pill">◔</span>分析</button>
    </div>
  </div>

  <div class="foot">
    这是 <b>网页试玩版</b>：界面照搬真机，逻辑用 JavaScript 重写过，数据只存在你这个浏览器里。<br>
    真正的安卓 app（Kotlin + Compose + Room）在
    <a href="https://github.com/HenryLiu520/HoBao" target="_blank" rel="noopener">GitHub 仓库</a>
    ｜
    <a href="https://github.com/HenryLiu520/HoBao/releases/latest" target="_blank" rel="noopener">下载 APK</a>
  </div>
</div>

<!-- 弹层 -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3 id="sheetTitle">选择</h3>
  <p class="hint" id="sheetHint"></p>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ══════════ 数据 ══════════ */
const RATE = { CNY:1, HKD:1.09, JPY:20.8, USD:0.14, EUR:0, GBP:0 }; // 1 CNY = ? 该币种（0 = 未填）
const MINOR = { CNY:2, HKD:2, JPY:0, USD:2, EUR:2, GBP:2 };
const NAME  = { CNY:"人民币", HKD:"港币", JPY:"日元", USD:"美元", EUR:"欧元", GBP:"英镑" };
const FLAG  = { CNY:"🇨🇳", HKD:"🇭🇰", JPY:"🇯🇵", USD:"🇺🇸", EUR:"🇪🇺", GBP:"🇬🇧" };
const ORDER = ["CNY","HKD","JPY","USD","EUR","GBP"];
/* 花销账本的分类。退款/返现排在最后 —— 它们记的是**负数**，
   和普通花销同住一张表，靠符号区分。 */
const CATS = [
  { n:"餐饮", c:"#E8760B" }, { n:"交通", c:"#00696E" }, { n:"购物", c:"#B3261E" },
  { n:"住宿", c:"#6750A4" }, { n:"学习", c:"#2E6C3F" }, { n:"娱乐", c:"#8A5182" },
  { n:"其他", c:"#6B6B6B" },
  { n:"退款", c:"#8A5182" }, { n:"返现", c:"#2E6C3F" },
];
/* 收入账本是**另一张表**，分类也自成一套。 */
const CATS_IN = [
  { n:"工资", c:"#0F7B6C" }, { n:"奖金", c:"#B8860B" }, { n:"红包", c:"#B3261E" },
  { n:"利息", c:"#1565C0" }, { n:"其他收入", c:"#6B6B6B" },
];
const KEY = "hobao-demo-v2";

const state = {
  expenses: [],          // 花销账本：花销为正，退款为负
  incomes: [],           // 收入账本：独立一张表
  entryCurrency: "CNY",
  entryCategory: "餐饮",
  entryMode: "spend",    // spend | refund | income
  ledger: "spend",       // 回顾页在看哪一本
  filterCategory: null,
  query: "",
};

/* ══════════ 存储 ══════════ */
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw) || {};
      state.expenses = Array.isArray(d.expenses) ? d.expenses : [];
      state.incomes = Array.isArray(d.incomes) ? d.incomes : [];
      return;
    }
  } catch (e) { /* 存储坏了就当空的 */ }
  // 第一次来：塞一批样例，不然一进来空荡荡看不出东西。
  // 特意跨了大半个月 + 跨月，这样「分析」页的按日/按周/按月才有东西可看。
  const ago = (days, h, mi) => {
    const d = new Date();
    d.setDate(d.getDate() - days);
    d.setHours(h, mi, 0, 0);
    return d.getTime();
  };
  const now = Date.now();
  state.expenses = [

/* ══════════ 换算与格式化 ══════════ */
function toCnyMinor(amountMinor, code, rate) {
  return Math.round(amountMinor * 100 / (Math.pow(10, MINOR[code]) * rate));
}
/* 一叠账折成人民币分。退款是负数行，所以直接相加就是净额 —— 不用另算 */
function sumCny(list) {
  return list.reduce((s, e) => s + toCnyMinor(e.amountMinor, e.code, e.rate), 0);
}
function fmt(minor, code) {
  const mu = MINOR[code], neg = minor < 0, abs = Math.abs(minor);
  const unit = Math.pow(10, mu);
  const whole = Math.floor(abs / unit).toLocaleString("en-US");
  const frac = mu ? "." + String(abs % unit).padStart(mu, "0") : "";
  // 负号属于**数字**，不属于货币代码：CNY -20.00，不是 -CNY 20.00（和真机一致）
  return code + " " + (neg ? "-" : "") + whole + frac;
}
function parseAmount(s, mu) {
  s = String(s).trim().replace(/,/g, "");
  if (!s) return null;
  if (mu === 0) {
    if (!/^\d{0,9}(\.\d{1,2})?$/.test(s)) return null;
    return Math.ceil(parseFloat(s));            // 日元：小数向上进位
  }
  if (!new RegExp("^\\d{0,9}(\\.\\d{1," + mu + "})?$").test(s)) return null;
  const [w, f = ""] = s.split(".");
  return parseInt(w || "0", 10) * Math.pow(10, mu) +
         parseInt((f + "0".repeat(mu)).slice(0, mu) || "0", 10);
}
function dayLabel(ms) {
  const d = new Date(ms), n = new Date();
  const s = (d.getMonth() + 1) + "月" + d.getDate() + "日";
  return d.getFullYear() === n.getFullYear() ? s : d.getFullYear() + "年" + s;
}
function timeLabel(ms) {
  const d = new Date(ms);
  return (d.getMonth() + 1) + "月" + d.getDate() + "日 " +
         String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function catColor(name, income) {
  const c = (income ? CATS_IN : CATS).find(x => x.n === name) ||
            CATS_IN.find(x => x.n === name) || CATS.find(x => x.n === name);
  return c ? c.c : "#6B6B6B";
}

    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });
  const expense = sumCny(cny.filter(e => e.amountMinor > 0));

  const inc = sumCny(state.incomes.filter(e => {

  }));

  });

  // 金额校验

function esc(s) {

}

/* ══════════ 分析 ══════════ */
/* 和真机同一套口径：
   1. 聚合只到"天"，周/月/季/年在内存里折叠
   2. 换粒度不改总额
   3. 只算到今天，未来的日子不补零
   4. 周从周一起（和「本周」一致）                                  */
const AN_ACCENT = "#3D5AFE";
const AN_RANGES = [
  { k: "week", t: "本周" }, { k: "month", t: "本月" },
  { k: "quarter", t: "本季" }, { k: "year", t: "本年" },
];
const AN_GRANS = [
  { k: "day", t: "日", u: "天" }, { k: "week", t: "周", u: "周" },
  { k: "month", t: "月", u: "个月" }, { k: "quarter", t: "季度", u: "季" },
  { k: "year", t: "年", u: "年" },
];
state.analysisRange = "month";
state.granularity = "day";
state.granPicked = false;

function anRange(kind) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let start;
  if (kind === "week") {
    const dow = (today.getDay() + 6) % 7;              // 周一 = 0
    start = new Date(today.getFullYear(), today.getMonth(), today.getDate() - dow);
  } else if (kind === "month") {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
  } else if (kind === "quarter") {
    start = new Date(now.getFullYear(), Math.floor(now.getMonth() / 3) * 3, 1);
  } else {
    start = new Date(now.getFullYear(), 0, 1);
  }
  const endEx = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);
  return { start, endEx };
}

/* 这一天属于哪个桶 —— 返回桶的起始日 */
function bStart(d, g) {
  const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  if (g === "week") {
    const dow = (d.getDay() + 6) % 7;
    return new Date(y, m, day - dow);
  }
  if (g === "month") return new Date(y, m, 1);
  if (g === "quarter") return new Date(y, Math.floor(m / 3) * 3, 1);
  if (g === "year") return new Date(y, 0, 1);
  return new Date(y, m, day);
}
function bNext(d, g) {
  const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  if (g === "week") return new Date(y, m, day + 7);
  if (g === "month") return new Date(y, m + 1, 1);
  if (g === "quarter") return new Date(y, m + 3, 1);
  if (g === "year") return new Date(y + 1, 0, 1);
  return new Date(y, m, day + 1);
}
function bLabel(d, g) {
  const m = d.getMonth() + 1, day = d.getDate();
  if (g === "day" || g === "week") return m + "/" + String(day).padStart(2, "0");
  if (g === "month") return m + "月";
  if (g === "quarter") return "Q" + (Math.floor(d.getMonth() / 3) + 1);
  return String(d.getFullYear());
}

function anBuckets(start, endEx, g) {
  const out = [], idx = new Map();
  for (let d = bStart(start, g); d < endEx && out.length < 400; d = bNext(d, g)) {
    idx.set(d.getTime(), out.length);
    out.push({ d: new Date(d), v: 0 });
  }
  const a = start.getTime(), b = endEx.getTime();
  state.expenses.forEach(e => {
    if (e.at < a || e.at >= b) return;
    const i = idx.get(bStart(new Date(e.at), g).getTime());
    if (i !== undefined) out[i].v += toCnyMinor(e.amountMinor, e.code, e.rate);
  });
  return out;
}

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}

function renderDonut(slices, totalMinor) {
  const R = 70, C = 2 * Math.PI * R, gap = slices.length > 1 ? 3 : 0;
  let off = 0, parts = [];
  slices.forEach(s => {
    const len = C * s.f;
    parts.push(
      '<circle cx="100" cy="100" r="' + R + '" fill="none" stroke="' + s.color + '"' +
      ' stroke-width="26" stroke-dasharray="' + Math.max(0, len - gap) + ' ' + (C - len + gap) + '"' +
      ' stroke-dashoffset="' + (-off) + '" transform="rotate(-90 100 100)"/>'
    );
    off += len;
  });
  $("donut").innerHTML = parts.join("");
  $("donutTotal").textContent = fmt(totalMinor, "CNY");
}

function renderTrend(buckets, g) {
  const n = buckets.length;
  const svg = $("trendChart"), box = Math.max(240, $("chartScroll").clientWidth || 320);
  const H = 190, padL = 46, padR = 16, padT = 14, padB = 26;
  const per = Math.max(20, (box - padL - padR) / 14);
  const W = n <= 14 ? box : Math.round(padL + n * per + padR);
  const plotW = W - padL - padR, plotH = H - padT - padB;

  // 趋势画的是**净额**，可能跌破 0（那天只退了钱、没花）。
  // 所以纵轴下端要能容纳负数 —— 否则负值会被压到坐标轴外面，看起来像"没有数据"。
  const maxCny = Math.max(0, ...buckets.map(b => b.v)) / 100;
  const minCny = Math.min(0, ...buckets.map(b => b.v)) / 100;
  const maxY = niceMax(maxCny);
  const minY = minCny < 0 ? -niceMax(-minCny) : 0;
  const span = (maxY - minY) || 1;
  const xAt = i => n === 1 ? padL + plotW / 2 : padL + i * plotW / (n - 1);
  const yAt = v => padT + plotH - ((v / 100 - minY) / span) * plotH;
  const yZero = yAt(0);

  let out = "", yOut = "";
  // 网格画在主图里（跟着滚），刻度画在冻结层里（不跟着滚）
  [0, 0.25, 0.5, 0.75, 1].forEach(f => {
    const y = padT + plotH - f * plotH;
    out += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y +
           '" stroke="#D8D4E0" stroke-width="1" stroke-dasharray="4 4"/>';
    yOut += '<text x="' + (padL - 8) + '" y="' + (y + 4) +
            '" font-size="10.5" fill="#63606A" text-anchor="end">' +
            Math.round(minY + f * span) + '</text>';
  });
  // 有负数时，把 0 线单独画实
  if (minY < 0) {
    out += '<line x1="' + padL + '" y1="' + yZero + '" x2="' + (W - padR) + '" y2="' + yZero +
           '" stroke="#9A93A8" stroke-width="1.4"/>';
  }
  const ya = $("yaxis");
  ya.setAttribute("width", padL);
  ya.setAttribute("height", H);
  ya.setAttribute("viewBox", "0 0 " + padL + " " + H);
  ya.innerHTML = yOut;
  // 面积
  if (n > 1) {
    let area = "M " + xAt(0) + " " + yZero;
    buckets.forEach((b, i) => { area += " L " + xAt(i) + " " + yAt(b.v); });
    area += " L " + xAt(n - 1) + " " + yZero + " Z";
    out += '<path d="' + area + '" fill="' + AN_ACCENT + '" opacity="0.16"/>';
    // 折线
    let line = "";
    buckets.forEach((b, i) => { line += (i ? " L " : "M ") + xAt(i) + " " + yAt(b.v); });
    out += '<path d="' + line + '" fill="none" stroke="' + AN_ACCENT +
           '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  // 数据点（只有一个桶时就靠这个点表达）
  if (n <= 40) {
    buckets.forEach((b, i) => {
      out += '<circle cx="' + xAt(i) + '" cy="' + yAt(b.v) + '" r="3.6" fill="' + AN_ACCENT + '"/>';
    });
  }
  // 横轴标签：最多 6 个
  const step = Math.max(1, Math.ceil(n / 6));
  buckets.forEach((b, i) => {
    if (i % step !== 0 && i !== n - 1) return;
    out += '<text x="' + xAt(i) + '" y="' + (H - 6) +
           '" font-size="10.5" fill="#63606A" text-anchor="middle">' + bLabel(b.d, g) + '</text>';
  });

  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.innerHTML = out;

  // 默认停在最右（最近），和真机一致
  const sc = $("chartScroll");
  requestAnimationFrame(() => { sc.scrollLeft = sc.scrollWidth; });
}

function renderAnalysis() {
  const { start, endEx } = anRange(state.analysisRange);
  const days = Math.max(1, Math.round((endEx - start) / 86400000));
  const a = start.getTime(), b = endEx.getTime();
  const inRange = state.expenses.filter(e => e.at >= a && e.at < b);
  // 【三个数】分析页的「总支出」只算正数行 —— 日均的分母是它，
  // 让它变成负数就会出现「日均 -0.67 元」这种没法读的东西。
  const spendRows = inRange.filter(e => e.amountMinor > 0);
  const expense = sumCny(spendRows);
  const refund = sumCny(inRange.filter(e => e.amountMinor < 0));
  const net = expense + refund;
  const income = sumCny(state.incomes.filter(e => e.at >= a && e.at < b));

  const label = (AN_RANGES.find(r => r.k === state.analysisRange) || AN_RANGES[1]).t;
  $("anRangeLabel").textContent = label + " · 共 " + days + " 天";
  $("anTotal").textContent = fmt(expense, "CNY");
  $("anSub").textContent = spendRows.length + " 笔 · 日均 " + fmt(Math.round(expense / days), "CNY");
  $("anRefund").hidden = refund === 0;
  $("anRefund").textContent = "退款 " + fmt(refund, "CNY") + " · 净 " + fmt(net, "CNY");
  $("anIncome").hidden = income === 0;
  $("anIncome").textContent = "同区间收入 " + fmt(income, "CNY");

  // 分类占比：只用**正数行**。退款是负的，放进饼图会画出负扇区
  const byCat = new Map();
  spendRows.forEach(e => {
    byCat.set(e.cat, (byCat.get(e.cat) || 0) + toCnyMinor(e.amountMinor, e.code, e.rate));
  });
  const slices = [...byCat.entries()]
    .map(([name, v]) => ({ name, v, f: expense > 0 ? v / expense : 0, color: catColor(name) }))
    .sort((x, y) => y.v - x.v);

  if (slices.length) {
    renderDonut(slices, expense);
    $("catList").innerHTML = slices.map(s =>
      '<div class="an-row"><span class="dot" style="background:' + s.color + '"></span>' +
      '<span class="nm">' + esc(s.name) + '</span>' +
      '<span><div class="amt">' + fmt(s.v, "CNY") + '</div>' +
      '<div class="pct">' + (s.f * 100).toFixed(1) + '% · ' +
      spendRows.filter(e => e.cat === s.name).length + ' 笔</div></span></div>'
    ).join("");
  } else {
    renderDonut([], 0);
    $("catList").innerHTML = '<div class="empty">' +
      (refund !== 0 ? '这段时间没有支出，只有退款' : '这段时间还没有账单') + '</div>';
  }

  // 趋势
  const buckets = anBuckets(start, endEx, state.granularity);
  const g = AN_GRANS.find(x => x.k === state.granularity) || AN_GRANS[0];
  $("trendCount").textContent = buckets.length + " " + g.u;
  renderTrend(buckets, state.granularity);

  // 芯片
  $("rangeChips").innerHTML = AN_RANGES.map(r =>
    '<button class="chip" data-r="' + r.k + '" aria-pressed="' + (r.k === state.analysisRange) + '">' + r.t + '</button>'
  ).join("");
  $("rangeChips").querySelectorAll(".chip").forEach(el => {
    el.onclick = () => {
      state.analysisRange = el.dataset.r;
      if (!state.granPicked) {
        const coarse = state.analysisRange === "quarter" || state.analysisRange === "year";
        state.granularity = coarse ? "month" : "day";
      }
      renderAnalysis();
    };
  });
  $("granChips").innerHTML = AN_GRANS.map(x =>
    '<button class="chip" data-g="' + x.k + '" aria-pressed="' + (x.k === state.granularity) + '">' + x.t + '</button>'
  ).join("");
  $("granChips").querySelectorAll(".chip").forEach(el => {
    el.onclick = () => { state.granPicked = true; state.granularity = el.dataset.g; renderAnalysis(); };
  });
}

/* ══════════ 交互绑定 ══════════ */
function switchTab(which) {
  $("screen-add").hidden = which !== "add";
  $("screen-history").hidden = which !== "history";
  $("screen-analysis").hidden = which !== "analysis";
  $("tabAdd").setAttribute("aria-selected", String(which === "add"));
  $("tabHist").setAttribute("aria-selected", String(which === "history"));
  $("tabAna").setAttribute("aria-selected", String(which === "analysis"));
  $("title").textContent = which === "add" ? "记一笔" : which === "history" ? "回顾" : "分析";
  if (which === "add") renderEntry();
  else if (which === "history") renderHistory();
  else renderAnalysis();
}

$("tabAdd").onclick = () => switchTab("add");
$("tabHist").onclick = () => switchTab("history");
$("tabAna").onclick = () => switchTab("analysis");
/* 切模式：分类跟着换一套，退款默认选中「退款」——
   它排在芯片最右边，不预选的话用户得横向滑到尽头才找得到 */
function setEntryMode(m) {
  if (state.entryMode === m) return;
  state.entryMode = m;
  state.entryCategory = m === "refund" ? "退款" : catsFor(m)[0].n;
  renderEntry();
}
$("segSpend").onclick  = () => setEntryMode("spend");
$("segRefund").onclick = () => setEntryMode("refund");
$("segIncome").onclick = () => setEntryMode("income");

/* 回顾页两个账本 */
$("ledSpend").onclick  = () => { state.ledger = "spend";  renderHistory(); };
$("ledIncome").onclick = () => { state.ledger = "income"; renderHistory(); };

$("currencyBtn").onclick = openCurrencySheet;
$("funnel").onclick = openCategorySheet;
$("scrim").onclick = closeSheet;
$("amount").oninput = renderEntry;

// 日期：只允许今天及以前
$("date").max = new Date().toISOString().slice(0, 10);
$("date").onchange = () => {
  const v = $("date").value;
  if (!v) { $("dateVal").textContent = "今天"; return; }
  const d = new Date(v + "T00:00:00");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  if (d > today) { $("date").value = ""; $("dateVal").textContent = "今天"; return; }
  $("dateVal").textContent = dayLabel(d.getTime());
};

// 保存
$("saveBtn").onclick = () => {
  const code = state.entryCurrency;
  const mu = MINOR[code];
  const amount = parseAmount($("amount").value, mu);
  if (!amount || amount <= 0) return;

  // 日期：选了哪天就用哪天，但保留当前时分秒（和真机一致）
  let at = Date.now();
  const v = $("date").value;
  if (v) {
    const picked = new Date(v + "T00:00:00");
    const now = new Date();
    picked.setHours(now.getHours(), now.getMinutes(), now.getSeconds(), now.getMilliseconds());
    at = picked.getTime();
  }

  const reason = $("reason").value.trim() || state.entryCategory;  // 留空用分类名

  if (state.entryMode === "income") {
    // 收入进**另一本账**
    state.incomes.push({
      id: Date.now() + Math.random(),
      amountMinor: amount,
      code, rate: RATE[code], reason, cat: state.entryCategory, at,
    });
  } else {
    // 花销存正数，退款存**负数** —— 同一个账本，靠符号区分
    state.expenses.push({
      id: Date.now() + Math.random(),
      amountMinor: state.entryMode === "refund" ? -amount : amount,
      code, rate: RATE[code], reason, cat: state.entryCategory, at,
    });
  }
  save();

  $("amount").value = "";
  $("reason").value = "";
  $("date").value = "";
  $("dateVal").textContent = "今天";
  renderEntry();

  const whenSuffix = v ? " · " + dayLabel(at) : "";
  const verb = state.entryMode === "income" ? "已记收入 " : state.entryMode === "refund" ? "已记退款 " : "已记下 ";
  toast(verb + fmt(amount, code) + whenSuffix);
};

// 搜索
$("q").oninput = () => { state.query = $("q").value; renderHistory(); };
$("clearFilter").onclick = () => {
  state.filterCategory = null; state.query = ""; $("q").value = "";
  renderHistory();
};

/* ══════════ 启动 ══════════ */
load();
renderEntry();

// 深链：index.html#analysis 直接打开分析页（也方便截图/分享）
if (location.hash === "#analysis") switchTab("analysis");
else if (location.hash === "#history") switchTab("history");
</script>
</body>
