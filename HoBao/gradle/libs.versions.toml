# ── 版本目录(Version Catalog) ──
# 所有版本号只在这里出现一次，这是安卓官方推荐做法
#
# 三点关键(别改)：
# 1. 没有 kotlin-android 插件 —— AGP 9.0 起 Kotlin 编译已内置
# 2. kotlin 版本必须等于 AGP 内置的 Kotlin(AGP 9.4.1 → 2.2.10)
# 3. ksp 从 2.3.0 起不再跟 Kotlin 版本绑定；AGP 9 官方要求 KSP >= 2.3.6
[versions]
agp = "9.4.1"
kotlin = "2.2.10"
ksp = "2.3.12"
room = "2.8.5"
coreKtx = "1.19.1"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
navigationCompose = "2.10.2"
lifecycleViewmodelCompose = "2.11.0"
materialIconsCore = "1.7.8"
# WorkManager：每日后台同步汇率的调度器
work = "2.12.0"
# Vico：Compose 原生图表库（Apache 2.0）
# ⚠️ 卡在 3.2.3 不是随手写的：3.3.x 用 Kotlin 2.4.10 编译，元数据版本 2.4.0，
#    而 AGP 9.4.1 内置 Kotlin 2.2.10 的编译器只能读到 2.3.0 —— 引 3.3.1 直接编译失败。
#    3.2.3 用 Kotlin 2.3.21（元数据 2.3.0），刚好能读。
#    代价：3.3 才加的 PieChartHost 用不了 → 环形图自己用 Canvas 画。
#    真要升，得先确认 AGP 内置 Kotlin 能不能换版本，那是另一个量级的改动。
vico = "3.2.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
# BOM = 物料清单，用它就不用逐个写 compose 各组件版本
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
# 官方图标集(约 40 个基础图标：Add/List/Settings/Search/Delete…)
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "materialIconsCore" }

# ── 后台任务 ──
# runtime-ktx = WorkManager 本体 + 协程 Worker 支持
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# ── 图表 ──
# compose-m3 只是"用 Material3 配色包装 Vico"的一层皮，
# 真正的图表代码在它传递依赖的 multiplatform 模块里，所以只引这一个就够。
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

# ── Room 数据库 ──
# runtime  = 运行时库，界面/逻辑里用
# ktx      = 让它支持协程和 Flow(数据流)
# compiler = 注解处理器，编译期根据你的注解**生成**实现代码(不打包进 app)
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# KSP = Kotlin Symbol Processing，Room 靠它生成代码
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
